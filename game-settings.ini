# Crema - game settings center
#
# The best settings found for each game on a PS4, to be applied when that game starts (the
# launcher feature is planned, after DolphinPS4's Game Settings Center: fetched from GitHub when
# online, a copy carried in the package for offline use).
#
# Sections are Wii U title IDs (16 hex digits, one region). Keys are crema.ini's (CremaSettings.cpp);
# only what a game needs differently from the defaults is listed, plus diagnostics_all=off.
# Order of priority (planned): the app's defaults < this file < /data/Crema/crema.ini < the
# menu's own settings.
# Every game here runs with diagnostics off: the file log, performance log, freeze reports, TV
# screenshots, profiler and GPU fault recorder all cost speed (the GPU fault recorder most: it
# copies every command buffer to disk).
# Tested on a base PS4 (1.6 GHz), Crema v01.91, 2026-10-10, unless a comment says otherwise.

# --- Tested -------------------------------------------------------------------------------------

[0005000010137f00]
# Donkey Kong Country: Tropical Freeze - runs well since v01.91 (the geometry shader wrote
# past its GS->VS ring: a GPU page fault at the title screen or the save menu, CE-34878-0).
# Menus ~20 FPS, cutscenes ~45 FPS (measured with diagnostics on; the player calls it perfect with
# them off). The thread quantum it was tested with:
thread_quantum=100000
diagnostics_all=off

[0005000010110000]
# Tekken Tag Tournament 2 Wii U Edition - fights ~33-38 FPS, menus and loading 60. It went
# back to the menu after ~5 minutes until v01.78 (the GPU log leaked a file per line; the game's
# own file loads then failed). Stutters come from 1-3 s recompiles of large functions: the second
# launch onward precompiles them (cache/jit). Compare Results: Fast works since v01.67.
diagnostics_all=off

[000500001010ec00]
# Mario Kart 8 (US) - races ~45-52 FPS, menus 60, no slow compiles. The GPU command thread
# (LatteThread) is the limit, not the emulated CPU cores.
diagnostics_all=off

