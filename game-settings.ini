# Crema - recommended settings
#
# The settings found best for each game tested on a PS4. Crema carries this file in its package and
# downloads the newest one from GitHub when it opens (the higher [crema] revision wins). With
# Settings > Emulation > Recommended Settings on (the default), a game that isn't set to its own
# settings starts with its section's values: the default < your settings for all games < the
# game's recommended settings < the game's own settings. Triangle > Information shows them.
#
# Sections are Wii U title IDs (16 hex digits). In each:
#   name, status, fps, note - for the Information panel and the README's compatibility list
#     status: Playable, Ingame, Intro, Loadable or Nothing (see the README)
#   crema.ini keys (gui/ps4/launcher/CremaSettings.cpp) - only what differs from the defaults.
#     Diagnostics, Online and Language keys are ignored here.
# Raise the revision (date + two digits) with every change, or consoles keep their copy.
# Tested on a base PS4 (1.6 GHz) with every Diagnostics switch off, unless a comment says otherwise.

[crema]
revision=2026101702

# --- Tested -------------------------------------------------------------------------------------

[00050000101c9400]
# The Legend of Zelda: Breath of the Wild - 20-24 FPS of 30 with Graphics Accuracy Fast, Thread
# Quantum 100000 and the FPS++ and Draw Distance graphic packs (packs aren't set here: Triangle >
# Graphic Packs). The first 2-3 minutes after loading are slow while its code compiles.
name=The Legend of Zelda: Breath of the Wild
status=Playable
fps=20-24 of 30
note=Also turn on the FPS++ and Draw Distance graphic packs. Slow for 2-3 minutes after loading.
gpu_accuracy=fast
thread_quantum=100000

[0005000010137f00]
# Donkey Kong Country: Tropical Freeze - runs well since v01.91 (the geometry shader wrote past its
# GS->VS ring: a GPU page fault at the title screen or the save menu, CE-34878-0). Menus ~20 FPS,
# cutscenes ~45 FPS (measured with diagnostics on; smooth with them off).
name=Donkey Kong Country: Tropical Freeze
status=Playable
fps=menus ~20, cutscenes ~45
note=Smooth with every Diagnostics switch off.
thread_quantum=100000

[000500001010ec00]
# Mario Kart 8 (US) - races ~45-52 FPS, menus 60, no slow compiles. The GPU command thread
# (LatteThread) is the limit, not the emulated CPU cores.
name=Mario Kart 8
status=Playable
fps=races 45-52, menus 60
note=Runs on the default settings.

[00050000101d9d00]
# Minecraft: Wii U Edition - with its update: ~37 FPS, 15+ minutes without a crash (2026-10-10,
# v01.94) once Thread Fairness was off; with it on, the game's own code hit null pointers within
# 1-7 minutes (it relies on the Wii U's strict thread priorities).
name=Minecraft: Wii U Edition
status=Playable
fps=~37
note=Install its update. Thread Fairness must stay off.
thread_fairness=off

[0005000010102000]
# Nintendo Land - ~60 FPS.
name=Nintendo Land
status=Playable
fps=~60
note=Runs on the default settings.

[000500001f600a00]
# Paper Mario: Color Splash (US, v16) - a 30 FPS game. Accurate: median 28.1 FPS (~93%) over
# 48 min; Fast: ~29.5 FPS (~98%), dropping to ~21 in a busier town (2026-10-16, Lab v02.28), but
# parts of the map drew black in that run - Fast isn't recommended until that's sorted out.
# CPU-bound: Wii U cores 0 and 1 ~99%, LatteThread ~90%, GPU 10-15%. Same speed from the network
# library as from the console.
name=Paper Mario: Color Splash
status=Playable
fps=~28 of 30 (21-30)
note=Graphics Accuracy Fast is faster (~29.5) but parts of the map may show black.

[0005000010110a00]
# Ninja Gaiden 3: Razor's Edge (US) - cutscene videos stayed black with their sound playing until
# Thread Fairness was on (2026-10-12): the video thread on Wii U core 2 sat ready behind busier
# threads, so the game fed the H.264 decoder ~15 frames, then nothing for a minute. With it on,
# cutscenes play at 30 FPS. Gameplay 17-30 FPS (47-49 in light areas; Cemu on a PC: 60): the main
# thread on core 1 ~91%, the GPU command thread 99%, the GPU ~13% - CPU-bound.
name=Ninja Gaiden 3: Razor's Edge
status=Ingame
fps=17-30 (60 on a PC)
note=Thread Fairness makes its cutscenes play.
thread_fairness=on
gpu_accuracy=fast

[000500001014b700]
# New Super Mario Bros. U + New Super Luigi U - ~30 FPS of 60 (not retested since v01.91).
name=New Super Mario Bros. U + New Super Luigi U
status=Ingame
fps=~30 of 60
note=Runs at about half speed.

[0005000010145c00]
# Super Mario 3D World - ~30 FPS of 60 (not retested since v01.91).
name=Super Mario 3D World
status=Ingame
fps=~30 of 60
note=Runs at about half speed.

[0005000010110000]
# Tekken Tag Tournament 2 Wii U Edition - fights ~33-38 FPS, menus and loading 60. Stutters come
# from 1-3 s recompiles of large functions: the second launch onward precompiles them (cache/jit).
# Thread Fairness on: without it the fights stop while loading (the music decoder thread starves).
name=Tekken Tag Tournament 2 Wii U Edition
status=Ingame
fps=fights 33-38, menus 60
note=Thread Fairness keeps fights from stopping while they load.
thread_fairness=on

[00050000101c4d00]
# Xenoblade Chronicles X - Cemu's game profile makes it single-core (CPU Mode Auto, v01.95);
# multi-core broke its resource list (exit(1) or a crash in CResourceManager::update within a
# minute). Install its update. ~30 FPS in the intro.
name=Xenoblade Chronicles X
status=Ingame
fps=~30 in the intro
note=Install its update. CPU Mode must be Auto (single-core).
cpu_mode=auto
thread_fairness=off

[0005000010137c00]
# Batman: Arkham Origins - Cemu's game profile makes it single-core (CPU Mode Auto, v01.95). Ran out
# of Vulkan descriptor sets until v01.92 (more pools are added now). The first launch takes ~1 min.
name=Batman: Arkham Origins
status=Ingame
fps=not measured
note=CPU Mode must be Auto (single-core). The first start takes about a minute.
cpu_mode=auto


[0005000010128f00]
# Sonic Lost World (EU) - Sonic's legs and the animated scenery broke on the PS4 until Crema Lab
# v02.60 (the PS4 GPU read misaligned vertex fetches wrong; fixed in its graphics driver). 20-32 FPS
# with Thread Quantum 100000, Graphics Accuracy Fast, FSR 1, VSync and the Graphic Options pack at
# TV 854x480 / GamePad 320x180 (packs aren't set here: Triangle > Graphic Packs). Thread Fairness
# off (on, it froze and crashed more). Still crashes now and then in the game's job system.
name=Sonic Lost World
status=Ingame
fps=20-32 of 60
note=Needs Crema Lab 02.60 or newer. Graphic Options pack: TV 854x480, GamePad 320x180. Crashes now and then.
thread_quantum=100000
gpu_accuracy=fast
upscale_filter=fsr
vsync=on
audio_buffer=5

[00050000101ed800]
# Tokyo Mirage Sessions #FE - closed 3 s in until Crema Lab v02.66: its shaders write to memory
# (MEM_EXPORT/WAIT_ACK), which the shader decompiler doesn't support, and a geometry shader then read
# a missing copy program. Now those draws are skipped and the game runs at its full 30 FPS.
name=Tokyo Mirage Sessions #FE
status=Playable
fps=30 of 30
note=Needs Crema Lab 02.66 or newer.

[0005000010109500]
# Donkey Kong Country (SNES, Virtual Console, US) - closed at once with a GPU page fault
# (CE-34878-0): a colour buffer whose slice size is smaller than one row of its pitch had no
# height, and the GPU read the 0-row image as 16384 rows. Fixed in Lab v02.27 (2026-10-15); not
# yet played past the start.
name=Donkey Kong Country (Virtual Console)
status=Nothing
fps=not measured
note=Closed at start before Crema Lab v02.27; the fix is waiting for a test.
