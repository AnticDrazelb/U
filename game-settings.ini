# Crema - game settings center
#
# The best settings found for each game on a PS4, to be applied when that game starts (the
# launcher feature is planned, after DolphinPS4's Game Settings Center: fetched from GitHub when
# online, a copy carried in the package for offline use).
#
# Sections are Wii U title IDs (16 hex digits, one region). Keys are crema.ini's (CremaSettings.cpp);
# only what a game needs differently from the defaults is listed, plus diagnostics_all=off.
# Order of priority (planned): the app's defaults < this file < /data/Crema/crema.ini < the
# menu's own settings.
# Every game here runs with diagnostics off: the file log, performance log, freeze reports, TV
# screenshots, profiler and GPU fault recorder all cost speed (the GPU fault recorder most: it
# copies every command buffer to disk).
# Tested on a base PS4 (1.6 GHz), Crema v01.91, 2026-10-10, unless a comment says otherwise.

# --- Tested -------------------------------------------------------------------------------------

[0005000010137f00]
# Donkey Kong Country: Tropical Freeze - runs well since v01.91 (the geometry shader wrote
# past its GS->VS ring: a GPU page fault at the title screen or the save menu, CE-34878-0).
# Menus ~20 FPS, cutscenes ~45 FPS (measured with diagnostics on; the player calls it perfect with
# them off). The thread quantum it was tested with:
thread_quantum=100000
diagnostics_all=off

[0005000010110000]
# Tekken Tag Tournament 2 Wii U Edition - fights ~33-38 FPS, menus and loading 60. It went
# back to the menu after ~5 minutes until v01.78 (the GPU log leaked a file per line; the game's
# own file loads then failed). Stutters come from 1-3 s recompiles of large functions: the second
# launch onward precompiles them (cache/jit). Compare Results: Fast works since v01.67.
# Thread Fairness on: without it the fights stop while loading (the music decoder thread starves).
thread_fairness=on
diagnostics_all=off

[000500001010ec00]
# Mario Kart 8 (US) - races ~45-52 FPS, menus 60, no slow compiles. The GPU command thread
# (LatteThread) is the limit, not the emulated CPU cores.
diagnostics_all=off

[0005000010110a00]
# Ninja Gaiden 3: Razor's Edge (US, no update) - cutscene videos stayed black with their sound
# playing until Thread Fairness was on (2026-10-12): the video thread on Wii U core 2 sat ready
# behind busier threads ("run 1% ready 98%"), so the game fed the H.264 decoder ~15 frames, then
# nothing for a minute. With it on, cutscenes play at 30 FPS. Gameplay 17-30 FPS (47-49 in light
# areas; Cemu on a PC: 60): the game's main thread on core 1 runs ~91% and the GPU command thread
# 99%, the GPU itself ~13% - CPU-bound; no setting changed it (Graphics Accuracy Fast, Lab v02.15).
thread_fairness=on
gpu_accuracy=fast
diagnostics_all=off

[000500001f600a00]
# Paper Mario: Color Splash (US, v16) - 30 FPS game. Graphics Accuracy Accurate: median 28.1 FPS
# (~93%, dips to 24) over 48 min; Fast: ~29.5 FPS (~98%, 28.4-30.2 after the intro), audio
# underruns mostly gone (Lab v02.28, 2026-10-16). Still CPU-bound: Wii U cores 0 and 1 ~99%,
# LatteThread ~90%, GPU 10-15%. Same speed from the network library as from the console.
gpu_accuracy=fast
diagnostics_all=off

# --- Played, not retested since v01.91 ----------------------------------------------------------

[000500001014b700]
# New Super Mario Bros. U + New Super Luigi U
diagnostics_all=off

[0005000010145c00]
# Super Mario 3D World
diagnostics_all=off

[00050000101d9d00]
# Minecraft: Wii U Edition - with its update: ~37 FPS, 15+ minutes without a crash (2026-10-10,
# v01.94) once Thread Fairness was off; with it on, the game's own code hit null pointers within
# 1-7 minutes (it relies on the Wii U's strict thread priorities). Graphics Accuracy: Fast is the
# busy-world option to try first.
thread_fairness=off
diagnostics_all=off

[00050000101c4d00]
# Xenoblade Chronicles X - Cemu's game profile makes it single-core (CPU Mode Auto, v01.95);
# multi-core broke its resource list (exit(1) or a crash in CResourceManager::update within a
# minute). Install its update. ~30 FPS in the intro.
cpu_mode=auto
thread_fairness=off
diagnostics_all=off

[0005000010137c00]
# Batman: Arkham Origins - Cemu's game profile makes it single-core (CPU Mode Auto, v01.95). Ran out
# of Vulkan descriptor sets until v01.92 (now more pools are added). The first launch takes ~1 min.
cpu_mode=auto
diagnostics_all=off
