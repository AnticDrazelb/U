# Crema settings, written by the launcher and the pause menu.
# [global] applies to every game; a [title ID] section with custom=on overrides it.

[global]
language=en
mii_data=crema
thread_quantum=100000

[000500001010ec00]
audio_buffer=3
cpu_mode=multi
custom=on
file_log=on
freeze_reports=on
game_volume=100
gamepad_audio=on
language=en
motion=on
perf_log=on
scaling=keep
shader_compile=async
show_fps=on
thread_quantum=default
touch_pointer=on
touchpad=touch
tv_screenshots=on
tv_shows=tv
upscale_filter=bicubic

[0005000010110000]
audio_buffer=3
cl_shifts=off
compare_results=fast
cpu_mode=multi
custom=on
cycle_counting=fast
fast_shifts=on
file_log=off
freeze_reports=on
game_volume=100
gamepad_audio=on
gpu_accuracy=accurate
gpu_trace=off
language=en
mii_data=crema
motion=on
online=off
