# --- Settings: Display
TV Shows = التلفاز يعرض
TV Screen = شاشة التلفاز
GamePad Screen = شاشة GamePad
What the TV shows when a game starts: the game's TV picture, or its GamePad screen (the pause menu swaps them). = ما يعرضه التلفاز عند بدء اللعبة: صورة التلفاز للعبة، أو شاشة GamePad (قائمة الإيقاف تبدّل بينهما).
Touch Pointer = مؤشر اللمس
A pointer where your finger is on the touchpad, so you can see where a touch lands. = مؤشر في مكان إصبعك على لوحة اللمس، لترى أين تقع اللمسة.
FPS Counter = عداد الإطارات
Frames per second in the top left corner. = عدد الإطارات في الثانية في الزاوية العلوية اليسرى.
VSync = المزامنة العمودية
On: each new picture waits for the TV's next refresh, so it never tears (a line where two pictures meet), but a frame can wait up to 16 ms. Off: pictures show at once (Cemu's VSync off). = تشغيل: كل صورة جديدة تنتظر التحديث التالي للتلفاز فلا يحدث تمزّق (خط تلتقي عنده صورتان)، لكن الإطار قد ينتظر حتى 16 مللي ثانية. إيقاف: تظهر الصور فوراً.
Picture Size = حجم الصورة
Keep Aspect Ratio = الحفاظ على نسبة العرض
Stretch fills the whole TV even when the game's picture has another shape. = التمديد يملأ التلفاز كله حتى لو كان شكل صورة اللعبة مختلفاً.
Upscaling Filter = مرشّح التكبير
Bicubic = تكعيبي
Bilinear = خطي ثنائي
Hermite = هيرميت
Nearest = الأقرب
How the game's picture is scaled up to the TV: Bicubic is the smoothest, Nearest the sharpest. = طريقة تكبير صورة اللعبة إلى التلفاز: التكعيبي هو الأنعم، والأقرب هو الأوضح.
# --- Settings: Emulation
CPU Mode = وضع المعالج
Multi-core Recompiler = مُعيد الترجمة متعدد الأنوية
Single-core Recompiler = مُعيد الترجمة أحادي النواة
Auto: what Cemu's profile for the game says (some games need single-core: Xenoblade Chronicles X, Batman: Arkham Origins), else multi-core. Multi-core runs the Wii U's three CPU cores on three PS4 cores (fastest). Single-core is for games that misbehave with it. = تلقائي: حسب ملف Cemu للعبة (بعض الألعاب تحتاج نواة واحدة: Xenoblade Chronicles X وBatman: Arkham Origins)، وإلا متعدد الأنوية. متعدد الأنوية يشغّل أنوية Wii U الثلاث على ثلاث أنوية في PS4 (الأسرع). أحادي النواة للألعاب التي لا تعمل جيداً معه.
Thread Quantum = حصة الخيط
How long an emulated thread runs before the next one. Only change it for a game that needs it. = المدة التي يعمل فيها الخيط المحاكى قبل التالي. غيّرها فقط للعبة تحتاج ذلك.
Shader Compilation = تجميع الظلال
Asynchronous: no stutter, but objects appear a moment late the first time. Synchronous: everything shows at once, with stutter. = غير متزامن: بدون تقطيع، لكن العناصر تظهر متأخرة قليلاً في المرة الأولى. متزامن: كل شيء يظهر فوراً، مع تقطيع.
Graphics Accuracy = دقة الرسوميات
Fast: the CPU doesn't wait for the GPU when a game asks it to, and fewer GPU barriers. Faster in busy games (Minecraft), but some games may flicker or show glitches. = سريع: المعالج لا ينتظر معالج الرسوميات عندما تطلب اللعبة ذلك، وحواجز أقل. أسرع في الألعاب المزدحمة (Minecraft)، لكن بعض الألعاب قد تومض أو تظهر فيها أخطاء.
The menus' language, and the Wii U's system language where it has it. = لغة القوائم، ولغة نظام Wii U إن كانت متوفرة فيه.
Mii Data When Missing = بيانات Mii عند غيابها
Crema Miis = شخصيات Mii من Crema
Without the Wii U's Mii data, games that show Miis crash or show them without heads. Crema Miis: Crema's own simple Mii parts are used instead. A dump of the Wii U's Mii data is never replaced. = بدون بيانات Mii من Wii U، تتعطل الألعاب التي تعرض شخصيات Mii أو تعرضها بلا رؤوس. شخصيات Mii من Crema: تُستخدم قطع Mii بسيطة من Crema بدلاً منها. لا يتم استبدال نسخة بيانات Mii الأصلية أبداً.
Compare Results = نتائج المقارنة
Fast: the recompiled code skips condition flags that are overwritten before use, and treats the ones a call may change as unused after it (faster on the PS4). Exact: keeps every flag, as Cemu does. Use Exact if a game misbehaves. = سريع: الكود المترجم يتخطى أعلام الشروط التي تُستبدل قبل استخدامها (أسرع على PS4). دقيق: يحتفظ بكل الأعلام كما يفعل Cemu. استخدم دقيق إذا لم تعمل اللعبة جيداً.
Thread Fairness = عدالة الخيوط
On: when a busy game thread keeps the others on its core from running (the PS4's cores are slower than a PC's), they still get turns (10 ms after waiting 10 ms). Fixes games that stop while loading (Tekken Tag Tournament 2's fights). Off: the Wii U's strict priorities, which some games rely on (Minecraft crashed within minutes with it on). = تشغيل: عندما يمنع خيط مشغول الخيوط الأخرى على نواته من العمل، تحصل هي أيضاً على دورها. يصلح الألعاب التي تتوقف أثناء التحميل (معارك Tekken Tag Tournament 2). إيقاف: أولويات Wii U الصارمة التي تعتمد عليها بعض الألعاب (تعطّل Minecraft مع التشغيل).
Core Balancing (Experimental) = موازنة الأنوية (تجريبي)
# --- Settings: Audio
Game Volume = صوت اللعبة
Volume of the games' sound. = مستوى صوت الألعاب.
GamePad Speaker = سماعة GamePad
Also plays what the game sends to the GamePad's speaker (some games play sounds only there). = يشغّل أيضاً ما ترسله اللعبة إلى سماعة GamePad (بعض الألعاب تشغّل أصواتاً هناك فقط).
Audio Buffer = المخزن المؤقت للصوت
Short (24 ms) = قصير (24 مللي ثانية)
Normal (36 ms) = عادي (36 مللي ثانية)
Long (60 ms) = طويل (60 مللي ثانية)
Sound queued ahead of playback. Longer: fewer crackles when a game slows down, a little more delay. = الصوت المجهّز مسبقاً قبل تشغيله. الأطول: طقطقة أقل عندما تتباطأ اللعبة، مع تأخير أكثر قليلاً.
# --- Settings: Controls
Touchpad = لوحة اللمس
GamePad Touch Screen = شاشة لمس GamePad
Minus / HOME = ناقص / HOME
Touch Screen: a click touches the GamePad screen at your finger, two fingers press Minus (left) or HOME (right). Minus / HOME: the touchpad's halves are those buttons. = شاشة اللمس: الضغطة تلمس شاشة GamePad عند إصبعك، وإصبعان يضغطان ناقص (يسار) أو HOME (يمين). ناقص / HOME: نصفا لوحة اللمس هما هذان الزران.
Motion Controls = التحكم بالحركة
The DualShock 4's motion sensors move the GamePad: tilt and turn it. = مستشعرات الحركة في DualShock 4 تحرّك GamePad: أمِله وأدِره.
