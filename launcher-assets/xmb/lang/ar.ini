# --- Settings: Diagnostics
Performance Log = سجل الأداء
Every 5 s, the GPU's and each thread's load in log.txt (what limits the frame rate). = كل 5 ثوانٍ، حِمل معالج الرسوميات وكل خيط في log.txt (ما يحدّ معدل الإطارات).
Freeze Reports = تقارير التجمّد
When a game stops for 15 s, where every thread waits goes to hang.log. = عندما تتوقف اللعبة 15 ثانية، يُكتب مكان انتظار كل خيط في hang.log.
TV Screenshots = لقطات شاشة التلفاز
File Access Log = سجل الوصول للملفات
Fast Shifts (Experimental) = الإزاحات السريعة (تجريبي)
Profiler = المحلل
GPU Fault Recorder = مسجّل أخطاء الرسوميات
